[project]
name = "bench"
version = "0.0.0"
description = "Bench — aide à la décision sur le positionnement prix Marketplace"
requires-python = ">=3.11"
# Les dépendances seront ajoutées en Phase 1 (ex. openpyxl/pandas, pytest, ruff).
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
